# Appearance

corner_radius  = 8
blur           = false
blur_passes    = 2
blur_radius    = 3
opacity        = 1.0
animations     = true
animation_duration = 320

# How windows appear and disappear.
#   zoom   pops the window out of / back into its own centre (mango-style)
#   slide  moves it in from below and drops it out on close
#   fade   opacity only
#   none   instant
animation_type_open      = zoom
animation_type_close     = zoom
animation_duration_open  = 300
animation_duration_close = 250
# how small a window starts when it opens / ends when it closes, 0.05..1.0
zoom_initial_ratio       = 0.72
zoom_end_ratio           = 0.76
# cubic-bezier control points, exactly like CSS: x1,y1,x2,y2
animation_curve_open     = 0.16,1.0,0.3,1.0
animation_curve_close    = 0.42,0.0,0.6,1.0

gap            = 8
border         = 2
border_focus   = 7aa2f7
border_normal  = 2f3549
normal_mode_color = e0af68
unfocused_borders = false
root_color     = 000000

# Layout
#
# Mod+N cycles bsp -> scroll (niri-style) -> drift (driftwm-style canvas).
# 'layout' picks the one every monitor starts in, but with remember_layout
# the layout the last session ended in wins.

layout            = bsp
remember_layout   = true
drift_snap        = 24
drift_nudge       = 20
drift_zoom_min    = 0.2
drift_zoom_max    = 3.0
drift_zoom_step   = 1.12
drift_pan_speed   = 1.0

# Input

warp_pointer   = true
repeat_rate    = 25
repeat_delay   = 600

# Autostart

# autostart = waybar
# autostart = waypaper --restore

