# Media, volume and backlight. The commands pick whichever helper is
# installed: wpctl ships with WirePlumber, pactl with the PulseAudio tools,
# and the backlight is driven by brightnessctl or light. Playback needs
# playerctl. The function row repeats the media keys for keyboards that do
# not have them, or that hide them behind Fn.
bind_insert = XF86AudioRaiseVolume = spawn:if command -v wpctl >/dev/null 2>&1; then wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+; else pactl set-sink-volume @DEFAULT_SINK@ +5%; fi
bind_insert = XF86AudioLowerVolume = spawn:if command -v wpctl >/dev/null 2>&1; then wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-; else pactl set-sink-volume @DEFAULT_SINK@ -5%; fi
bind_insert = XF86AudioMute = spawn:if command -v wpctl >/dev/null 2>&1; then wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle; else pactl set-sink-mute @DEFAULT_SINK@ toggle; fi
bind_insert = XF86AudioMicMute = spawn:if command -v wpctl >/dev/null 2>&1; then wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle; else pactl set-source-mute @DEFAULT_SOURCE@ toggle; fi
bind_insert = XF86AudioPlay = spawn:playerctl play-pause
bind_insert = XF86AudioPause = spawn:playerctl play-pause
bind_insert = XF86AudioStop = spawn:playerctl stop
bind_insert = XF86AudioNext = spawn:playerctl next
bind_insert = XF86AudioPrev = spawn:playerctl previous
bind_insert = XF86MonBrightnessUp = spawn:if command -v brightnessctl >/dev/null 2>&1; then brightnessctl set +10%; else light -A 10; fi
bind_insert = XF86MonBrightnessDown = spawn:if command -v brightnessctl >/dev/null 2>&1; then brightnessctl set 10%-; else light -U 10; fi
bind_insert = mod+F1 = spawn:playerctl play-pause
bind_insert = mod+F2 = spawn:playerctl previous
bind_insert = mod+F3 = spawn:playerctl next
bind_insert = mod+shift+F2 = spawn:playerctl position 10-
bind_insert = mod+shift+F3 = spawn:playerctl position 10+
bind_insert = mod+F4 = spawn:if command -v wpctl >/dev/null 2>&1; then wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle; else pactl set-sink-mute @DEFAULT_SINK@ toggle; fi
bind_insert = mod+shift+F4 = spawn:if command -v wpctl >/dev/null 2>&1; then wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle; else pactl set-source-mute @DEFAULT_SOURCE@ toggle; fi
bind_insert = mod+F5 = spawn:if command -v wpctl >/dev/null 2>&1; then wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-; else pactl set-sink-volume @DEFAULT_SINK@ -5%; fi
bind_insert = mod+F6 = spawn:if command -v wpctl >/dev/null 2>&1; then wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+; else pactl set-sink-volume @DEFAULT_SINK@ +5%; fi
bind_insert = mod+F7 = spawn:if command -v brightnessctl >/dev/null 2>&1; then brightnessctl set 10%-; else light -U 10; fi
bind_insert = mod+F8 = spawn:if command -v brightnessctl >/dev/null 2>&1; then brightnessctl set +10%; else light -A 10; fi

# Normal mode

bind_normal = i = wm:mode:insert
bind_normal = Tab = wm:focus_next
bind_normal = Left = wm:focus_left
bind_normal = Right = wm:focus_right
bind_normal = Up = wm:focus_up
bind_normal = Down = wm:focus_down
bind_normal = k = wm:focus_up
bind_normal = j = wm:focus_down
bind_normal = h = wm:ratio:-0.05
bind_normal = l = wm:ratio:+0.05
bind_normal = H = wm:swap_prev
bind_normal = L = wm:swap_next
bind_normal = s = wm:toggle_split
# Normal mode already owns the keyboard, so the function row needs no mod
bind_normal = F1 = spawn:playerctl play-pause
bind_normal = F2 = spawn:playerctl previous
bind_normal = F3 = spawn:playerctl next
bind_normal = F4 = spawn:if command -v wpctl >/dev/null 2>&1; then wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle; else pactl set-sink-mute @DEFAULT_SINK@ toggle; fi
bind_normal = F5 = spawn:if command -v wpctl >/dev/null 2>&1; then wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-; else pactl set-sink-volume @DEFAULT_SINK@ -5%; fi
bind_normal = F6 = spawn:if command -v wpctl >/dev/null 2>&1; then wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+; else pactl set-sink-volume @DEFAULT_SINK@ +5%; fi
bind_normal = F7 = spawn:if command -v brightnessctl >/dev/null 2>&1; then brightnessctl set 10%-; else light -U 10; fi
bind_normal = F8 = spawn:if command -v brightnessctl >/dev/null 2>&1; then brightnessctl set +10%; else light -A 10; fi
