# Appearance

corner_radius  = 8
blur           = false
blur_passes    = 2
blur_radius    = 3
opacity        = 1.0
animations     = true
animation_duration = 320

gap            = 8
border         = 2
border_focus   = 7aa2f7
border_normal  = 2f3549
normal_mode_color = e0af68
unfocused_borders = false
root_color     = 000000

# Input

warp_pointer   = true
repeat_rate    = 25
repeat_delay   = 600

# Autostart

# autostart = waybar
# autostart = waypaper --restore

# Insert mode

bind_insert = mod+q = spawn:alacritty
bind_insert = mod+Return = spawn:alacritty
bind_insert = mod+shift+q = wm:quit
bind_insert = mod+shift+r = wm:reload
bind_insert = mod+space = spawn:rofi -show drun
bind_insert = Print = spawn:grim
bind_insert = mod+c = wm:kill
bind_insert = mod+Escape = wm:mode:normal
bind_insert = mod+Tab = wm:focus_next
bind_insert = mod+f = wm:toggle_fullscreen
bind_insert = mod+shift+f = wm:toggle_real_fullscreen
bind_insert = mod+v = wm:toggle_float_centered
bind_insert = mod+b = wm:toggle_decorations
bind_insert = mod+o = wm:toggle_opacity
bind_insert = mod+Left = wm:focus_left
bind_insert = mod+Right = wm:focus_right
bind_insert = mod+Up = wm:focus_up
bind_insert = mod+Down = wm:focus_down
bind_insert = mod+h = wm:focus_left
bind_insert = mod+l = wm:focus_right
bind_insert = mod+k = wm:focus_up
bind_insert = mod+j = wm:focus_down
bind_insert = mod+shift+Left = wm:swap_left
bind_insert = mod+shift+Right = wm:swap_right
bind_insert = mod+shift+Up = wm:swap_up
bind_insert = mod+shift+Down = wm:swap_down
bind_insert = mod+shift+h = wm:swap_left
bind_insert = mod+shift+l = wm:swap_right
bind_insert = mod+shift+k = wm:swap_up
bind_insert = mod+shift+j = wm:swap_down
bind_insert = mod+Page_Up = wm:workspace_prev
bind_insert = mod+Page_Down = wm:workspace_next
bind_insert = mod+ctrl+Page_Up = wm:move_to_workspace_prev
bind_insert = mod+ctrl+Page_Down = wm:move_to_workspace_next
bind_insert = mod+1 = wm:workspace:1
bind_insert = mod+2 = wm:workspace:2
bind_insert = mod+3 = wm:workspace:3
bind_insert = mod+4 = wm:workspace:4
bind_insert = mod+5 = wm:workspace:5
bind_insert = mod+6 = wm:workspace:6
bind_insert = mod+7 = wm:workspace:7
bind_insert = mod+8 = wm:workspace:8
bind_insert = mod+9 = wm:workspace:9
bind_insert = mod+ctrl+1 = wm:move_to_workspace_follow:1
bind_insert = mod+ctrl+2 = wm:move_to_workspace_follow:2
bind_insert = mod+ctrl+3 = wm:move_to_workspace_follow:3
bind_insert = mod+ctrl+4 = wm:move_to_workspace_follow:4
bind_insert = mod+ctrl+5 = wm:move_to_workspace_follow:5
bind_insert = mod+ctrl+6 = wm:move_to_workspace_follow:6
bind_insert = mod+ctrl+7 = wm:move_to_workspace_follow:7
bind_insert = mod+ctrl+8 = wm:move_to_workspace_follow:8
bind_insert = mod+ctrl+9 = wm:move_to_workspace_follow:9
bind_insert = XF86AudioRaiseVolume = spawn:pactl set-sink-volume @DEFAULT_SINK@ +5%
bind_insert = XF86AudioLowerVolume = spawn:pactl set-sink-volume @DEFAULT_SINK@ -5%
bind_insert = XF86AudioMute = spawn:pactl set-sink-mute @DEFAULT_SINK@ toggle
bind_insert = F1 = spawn:playerctl play-pause
bind_insert = F2 = spawn:playerctl previous
bind_insert = F3 = spawn:playerctl next
bind_insert = XF86MonBrightnessUp = spawn:brightnessctl set +10%
bind_insert = XF86MonBrightnessDown = spawn:brightnessctl set 10%-

# Normal mode

bind_normal = i = wm:mode:insert
bind_normal = Tab = wm:focus_next
bind_normal = Left = wm:focus_left
bind_normal = Right = wm:focus_right
bind_normal = Up = wm:focus_up
bind_normal = Down = wm:focus_down
bind_normal = k = wm:focus_up
bind_normal = j = wm:focus_down
bind_normal = h = wm:ratio:-0.05
bind_normal = l = wm:ratio:+0.05
bind_normal = H = wm:swap_prev
bind_normal = L = wm:swap_next
bind_normal = s = wm:toggle_split
