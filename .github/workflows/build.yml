name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  arch:
    runs-on: ubuntu-latest
    container: archlinux:base-devel

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: >-
          pacman -Syu --needed --noconfirm git meson ninja pkgconf wayland
          wayland-protocols libinput libxkbcommon libxcb xcb-util-wm libdrm
          mesa pixman seatd wlroots0.19 xorg-xwayland

      - name: Build SceneFX
        run: |
          git clone --quiet --depth 1 --branch 0.4.1 https://github.com/wlrfx/scenefx.git /tmp/scenefx
          meson setup /tmp/scenefx/build /tmp/scenefx --prefix=/usr --libdir=lib --buildtype=release -Dexamples=false -Dwerror=false
          meson compile -C /tmp/scenefx/build
          meson install -C /tmp/scenefx/build

      - name: Build
        run: |
          make -j"$(nproc)"
          make -C tests -j"$(nproc)"

      - name: Check
        run: |
          sh -n install.sh gluewc-session tests/drm-test.sh
          git diff --check
          ./gluewc -v 2>&1 | grep -q '^gluewc '
